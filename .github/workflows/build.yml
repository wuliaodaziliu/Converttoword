name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build EXE
        run: |
          pip install pyinstaller
          pyinstaller build_spec.spec --clean 2>&1
          Get-ChildItem -Recurse dist

      - name: Prepare release bundle
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Filter "PDFToWordConverter.exe" -File -Recurse | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Recurse dist
            throw "Could not find PDFToWordConverter.exe under dist/"
          }

          $releaseDir = "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $releaseExe = Join-Path $releaseDir "PDFToWordConverter.exe"
          Copy-Item -Path $exe.FullName -Destination $releaseExe -Force

          $hash = Get-FileHash -Algorithm SHA256 $releaseExe
          "PDFToWordConverter.exe  " + $hash.Hash | Out-File -FilePath "$releaseExe.sha256" -Encoding ascii

      - name: Upload release exe
        uses: actions/upload-artifact@v4
        with:
          name: PDFToWordConverter-exe
          path: release/PDFToWordConverter.exe
          retention-days: 30

      - name: Upload sha256
        uses: actions/upload-artifact@v4
        with:
          name: PDFToWordConverter-exe-sha256
          path: release/PDFToWordConverter.exe.sha256
          retention-days: 30
