name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller build_spec.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFToWordConverter-exe
          path: dist/PDFToWordConverter.exe
          retention-days: 30

      - name: Upload Full Dist
        uses: actions/upload-artifact@v4
        with:
          name: PDFToWordConverter-dist
          path: dist/
          retention-days: 30